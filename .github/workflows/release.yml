name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            rife_platform: windows
            package_command: dist:win
            unpacked_dir: win-unpacked
          - os: ubuntu-22.04
            platform: linux
            rife_platform: linux
            package_command: dist:linux
            unpacked_dir: linux-unpacked
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Prepare bundled RIFE runtime
        run: python scripts/prepare-rife.py --platform ${{ matrix.rife_platform }}
      - run: npm test
      - run: npm run ${{ matrix.package_command }}
      - name: Verify packaged FFmpeg and RIFE files
        run: node scripts/package-smoke.cjs
      - name: Test desktop import and export
        if: runner.os == 'Windows'
        run: npx electron test/ui-smoke.cjs
        env:
          MOTION_APP_ROOT: dist/${{ matrix.unpacked_dir }}/resources/app.asar
      - name: Test desktop import and export
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron test/ui-smoke.cjs --no-sandbox
        env:
          MOTION_APP_ROOT: dist/${{ matrix.unpacked_dir }}/resources/app.asar
      - name: Create checksums
        run: python scripts/checksums.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: nx-motion-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: nx-motion-*
          path: dist
          merge-multiple: true
      - name: Add Hub manifest and third-party notices
        run: cp nx-app.json THIRD-PARTY-NOTICES.md dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.sha256
            dist/nx-app.json
            dist/THIRD-PARTY-NOTICES.md
          generate_release_notes: true
          fail_on_unmatched_files: true
